<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <rect width="400" height="600" fill="#111010"/>
  <!-- Grid lines -->
  <line x1="40" y1="0" x2="40" y2="600" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="360" y1="0" x2="360" y2="600" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="0" y1="60" x2="400" y2="60" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="0" y1="540" x2="400" y2="540" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Geometric structure -->
  <rect x="80" y="120" width="240" height="360" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.4"/>
  <rect x="100" y="140" width="200" height="320" fill="none" stroke="#F5F0E8" stroke-width="0.3" opacity="0.2"/>
  <!-- Cross structure -->
  <line x1="200" y1="80" x2="200" y2="520" stroke="#F5F0E8" stroke-width="0.5" opacity="0.3"/>
  <line x1="60" y1="300" x2="340" y2="300" stroke="#F5F0E8" stroke-width="0.5" opacity="0.3"/>
  <!-- Abstract surrealist form -->
  <ellipse cx="200" cy="220" rx="60" ry="80" fill="none" stroke="#F5F0E8" stroke-width="1" opacity="0.6"/>
  <ellipse cx="200" cy="220" rx="40" ry="55" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.5"/>
  <circle cx="200" cy="200" r="8" fill="#F5F0E8" opacity="0.4"/>
  <!-- Spiral lines -->
  <path d="M200,300 Q230,320 220,350 Q210,380 190,370 Q170,360 180,330 Q190,310 210,315" fill="none" stroke="#F5F0E8" stroke-width="0.8" opacity="0.4"/>
  <!-- Corner marks -->
  <line x1="80" y1="120" x2="100" y2="120" stroke="#C9A84C" stroke-width="1" opacity="0.6"/>
  <line x1="80" y1="120" x2="80" y2="140" stroke="#C9A84C" stroke-width="1" opacity="0.6"/>
  <line x1="320" y1="120" x2="300" y2="120" stroke="#C9A84C" stroke-width="1" opacity="0.6"/>
  <line x1="320" y1="120" x2="320" y2="140" stroke="#C9A84C" stroke-width="1" opacity="0.6"/>
  <line x1="80" y1="480" x2="100" y2="480" stroke="#C9A84C" stroke-width="1" opacity="0.6"/>
  <line x1="80" y1="480" x2="80" y2="460" stroke="#C9A84C" stroke-width="1" opacity="0.6"/>
  <line x1="320" y1="480" x2="300" y2="480" stroke="#C9A84C" stroke-width="1" opacity="0.6"/>
  <line x1="320" y1="480" x2="320" y2="460" stroke="#C9A84C" stroke-width="1" opacity="0.6"/>
  <!-- Text -->
  <text x="200" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#C9A84C" letter-spacing="4" opacity="0.7">ESTRUCTURA</text>
  <text x="200" y="545" text-anchor="middle" font-family="Georgia, serif" font-size="6" fill="#F5F0E8" letter-spacing="2" opacity="0.4">12 × 18 IN</text>
</svg>
