<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <rect width="400" height="600" fill="#0A0A0A"/>
  <!-- Art Deco border frame -->
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.5"/>
  <rect x="28" y="28" width="344" height="544" fill="none" stroke="#C9A84C" stroke-width="0.3" opacity="0.3"/>
  <!-- Top deco bar -->
  <rect x="20" y="20" width="360" height="3" fill="#C9A84C" opacity="0.6"/>
  <rect x="20" y="577" width="360" height="3" fill="#C9A84C" opacity="0.6"/>
  <!-- Corner ornaments -->
  <polygon points="20,20 50,20 20,50" fill="#C9A84C" opacity="0.3"/>
  <polygon points="380,20 350,20 380,50" fill="#C9A84C" opacity="0.3"/>
  <polygon points="20,580 50,580 20,550" fill="#C9A84C" opacity="0.3"/>
  <polygon points="380,580 350,580 380,550" fill="#C9A84C" opacity="0.3"/>
  <!-- Central geometric machine -->
  <!-- Outer gear ring -->
  <circle cx="200" cy="240" r="100" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.4"/>
  <circle cx="200" cy="240" r="90" fill="none" stroke="#F5F0E8" stroke-width="0.4" opacity="0.2"/>
  <!-- Gear teeth -->
  <circle cx="200" cy="240" r="108" fill="none" stroke="#C9A84C" stroke-width="3" opacity="0.3" stroke-dasharray="8 8"/>
  <!-- Inner rings -->
  <circle cx="200" cy="240" r="70" fill="none" stroke="#C9A84C" stroke-width="0.6" opacity="0.5"/>
  <circle cx="200" cy="240" r="45" fill="none" stroke="#F5F0E8" stroke-width="0.5" opacity="0.3"/>
  <!-- Spokes -->
  <line x1="200" y1="140" x2="200" y2="340" stroke="#C9A84C" stroke-width="0.8" opacity="0.4"/>
  <line x1="100" y1="240" x2="300" y2="240" stroke="#C9A84C" stroke-width="0.8" opacity="0.4"/>
  <line x1="129" y1="169" x2="271" y2="311" stroke="#C9A84C" stroke-width="0.5" opacity="0.3"/>
  <line x1="271" y1="169" x2="129" y2="311" stroke="#C9A84C" stroke-width="0.5" opacity="0.3"/>
  <!-- Center diamond -->
  <polygon points="200,215 225,240 200,265 175,240" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.7"/>
  <polygon points="200,225 215,240 200,255 185,240" fill="#C9A84C" opacity="0.15"/>
  <!-- Main title -->
  <text x="200" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#F5F0E8" letter-spacing="8" opacity="0.9" font-weight="bold">LA</text>
  <line x1="80" y1="408" x2="320" y2="408" stroke="#C9A84C" stroke-width="0.5" opacity="0.5"/>
  <text x="200" y="445" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#C9A84C" letter-spacing="6" opacity="0.9">MÁQUINA</text>
  <line x1="80" y1="458" x2="320" y2="458" stroke="#C9A84C" stroke-width="0.5" opacity="0.5"/>
  <!-- Sub details -->
  <text x="200" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#F5F0E8" letter-spacing="4" opacity="0.4">CEFIRO STUDIOS · MMXXV</text>
  <!-- Bottom label -->
  <text x="200" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#C9A84C" letter-spacing="3" opacity="0.5">18 × 24 IN · LIMITED EDITION</text>
</svg>
