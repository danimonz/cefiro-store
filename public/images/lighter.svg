<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <rect width="400" height="600" fill="#0A0A0A"/>
  <!-- Lighter body -->
  <rect x="150" y="160" width="100" height="300" rx="8" fill="#151515" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Lighter top -->
  <rect x="158" y="140" width="84" height="30" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="0.8"/>
  <!-- Flint wheel -->
  <ellipse cx="222" cy="148" rx="12" ry="5" fill="#252525" stroke="#333" stroke-width="0.8"/>
  <!-- Flame guard -->
  <rect x="160" y="133" width="60" height="12" rx="3" fill="#1f1f1f" stroke="#2a2a2a" stroke-width="0.8"/>
  <!-- Flame (subtle) -->
  <path d="M200,128 Q207,118 203,108 Q199,98 205,90 Q211,82 208,75 Q204,82 200,88 Q196,82 193,75 Q190,82 195,90 Q200,98 197,108 Q193,118 200,128Z" fill="#C9A84C" opacity="0.6"/>
  <path d="M200,128 Q204,120 202,112 Q200,104 203,97 Q206,90 204,85 Q202,90 200,95 Q198,90 196,85 Q194,90 197,97 Q200,104 198,112 Q196,120 200,128Z" fill="#F5F0E8" opacity="0.3"/>
  <!-- Logo on body -->
  <circle cx="200" cy="320" r="22" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.6"/>
  <text x="200" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#C9A84C" opacity="0.7">CS</text>
  <line x1="182" y1="322" x2="218" y2="322" stroke="#C9A84C" stroke-width="0.5" opacity="0.4"/>
  <!-- Surface texture -->
  <rect x="152" y="200" width="96" height="180" rx="3" fill="none" stroke="#1f1f1f" stroke-width="0.5"/>
  <!-- Subtle lines for texture -->
  <line x1="156" y1="240" x2="244" y2="240" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="156" y1="280" x2="244" y2="280" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="156" y1="360" x2="244" y2="360" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="156" y1="400" x2="244" y2="400" stroke="#1a1a1a" stroke-width="0.5"/>
  <!-- Gold trim lines -->
  <line x1="150" y1="180" x2="250" y2="180" stroke="#C9A84C" stroke-width="0.6" opacity="0.4"/>
  <line x1="150" y1="450" x2="250" y2="450" stroke="#C9A84C" stroke-width="0.6" opacity="0.4"/>
  <!-- Label -->
  <text x="200" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#C9A84C" letter-spacing="4" opacity="0.7">CEFIRO LIGHTER</text>
  <text x="200" y="565" text-anchor="middle" font-family="Georgia, serif" font-size="6" fill="#F5F0E8" letter-spacing="2" opacity="0.4">MATTE BLACK · GOLD</text>
</svg>
